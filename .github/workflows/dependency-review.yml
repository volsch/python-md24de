# Update pinned action SHAs with:
#   gh api repos/actions/checkout/git/ref/tags/v6 --jq '.object.sha'
#   gh api repos/actions/dependency-review-action/git/ref/tags/v5.0.0 --jq '.object.sha'
name: Dependency Review

on: [pull_request]

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # allows posting a summary comment on the PR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            MPL-2.0,
            PSF-2.0,
            Python-2.0
          allow-dependencies-licenses: >-
            pkg:githubactions/SonarSource/sonarqube-scan-action
          comment-summary-in-pr: always
